version: '3.9'

services:
  db:
    image: postgres:16
    container_name: insurance_db
    restart: always
    environment:
      POSTGRES_DB: insurance
      POSTGRES_USER: insurance_user
      POSTGRES_PASSWORD: insurance_pass
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./src/main/resources/insurance_db_backup.sql:/docker-entrypoint-initdb.d/insurance_db_backup.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U insurance_user -d insurance" ]
      interval: 30s
      timeout: 20s
      retries: 5

  app:
    build: .
    container_name: insurance_api
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/insurance
      SPRING_DATASOURCE_USERNAME: insurance_user
      SPRING_DATASOURCE_PASSWORD: insurance_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  db_data:
