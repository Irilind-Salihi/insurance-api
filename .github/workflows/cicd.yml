name: Pipeline

on:
  push:        # Run on any branch
  pull_request:  # Run on any PR

env:
  REPO: ${{ secrets.DOCKERHUB_USERNAME }}/insurance-api

jobs:
  test:
    name: Tests Maven
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: mvn clean verify