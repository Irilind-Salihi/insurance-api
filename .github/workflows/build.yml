name: Build and Package Spring Boot App

on:
  push:        # Run on any branch
  pull_request:  # Run on any PR

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3️⃣ Build and run tests
      - name: Build and Test with Maven
        run: mvn clean verify

      # 4️⃣ List the build artifacts (just for visibility)
      - name: List build artifacts
        run: ls -lh target/

      # 5️⃣ Upload built JAR as artifact
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: insurance-api-jar
          path: target/*.jar
